<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sightline operations console — live occupancy twin, alerts, and enforcement across your parking portfolio."
    />
    <meta name="theme-color" content="#FBFCFB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)" />
    <title>Sightline Operations</title>
    <script>
      // Pre-paint theme (Daylight v3): apply the persisted explicit choice
      // before any CSS loads so neither theme flashes the other. No stored
      // choice (or a legacy value) leaves the attribute off — tokens.css
      // then follows prefers-color-scheme, and the media-gated theme-color
      // metas above keep the browser chrome in step. An explicit choice
      // pins both metas to that theme's ground.
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem("sightline.settings.v1"))?.theme;
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
            var ground = theme === "dark" ? "#0F1412" : "#FBFCFB";
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.setAttribute("content", ground);
              m.removeAttribute("media");
            });
          }
        } catch (e) {
          /* storage unavailable — system default */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,500;0,700;1,500&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap"
