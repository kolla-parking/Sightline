services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://sightline:sightline@postgres:5432/sightline
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /models/yolov8n-obb.pt
      IOU_THRESHOLD: "0.40"
      CONFIDENCE_THRESHOLD: "0.45"
      SMOOTHING_WINDOW: "5"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8090}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-43200}
      MEMBER_SESSION_TTL: ${MEMBER_SESSION_TTL:-604800}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-Sightline <no-reply@sightline.local>}
      DEMO_RATE_LIMIT: ${DEMO_RATE_LIMIT:-5}
      DEMO_RATE_WINDOW: ${DEMO_RATE_WINDOW:-3600}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - ../models:/models
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sightline
      POSTGRES_USER: sightline
      POSTGRES_PASSWORD: sightline
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../scripts/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"

volumes:
  postgres-data:
