# Render Blueprint for the full Sightline stack.
#
# Services:
#   sightline       ONE static site serving all three surfaces:
#                     /               marketing
#                     /admin-portal   admin portal (static SPA)
#                     /login          console sign-in (SPA route, rewritten)
#                     /console/*      operator console (Vite/React SPA)
#   sightline-api   FastAPI backend (portal + console API, WebSocket stream)
#   sightline-redis Key Value (sessions, rate limits)
#
# Postgres lives on Supabase (project "sightline", us-west-2), not on Render:
# Render's free Postgres expires after 30 days. DATABASE_URL is therefore
# `sync: false` — set once in the dashboard (sightline-api > Environment) to
# the Supabase *Session pooler* URL (port 5432, IPv4 — the direct host is
# IPv6-only and Render egress is IPv4-only) with `?sslmode=require`. Blueprint
# syncs leave sync:false values untouched. Get the URL from Supabase >
# Connect > Session pooler; the old Render Postgres (sightline-db) can be
# deleted from the dashboard once data is no longer needed.
#
# The console is built at deploy time into marketing/console (never committed;
# see .gitignore). Static files win over rewrites, so /console/assets/* serve
# normally while /login and client-routed /console/* fall through to the SPA.
#
# The API URL is pinned (Render assigned it on first apply; stable for the
# life of the service). If the API is ever recreated under a new URL, update
# the pinned values here and push.
#
# Admin credentials: ADMIN_PASSWORD is generated by Render on first apply —
# read/change it under sightline-api > Environment.

services:
  - type: keyvalue
    name: sightline-redis
    plan: free
    ipAllowList: [] # private network only

  - type: web
    name: sightline-api
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r backend/requirements-deploy.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Supabase session-pooler URL — see header comment
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sightline-redis
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@sightline.test
      - key: ADMIN_PASSWORD
        generateValue: true
      # Exact-match origins (local dev); onrender.com origins are covered by
      # the regex below.
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:8090
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.onrender\.com

  - type: web
    name: sightline
    runtime: static
    staticPublishPath: marketing
    buildCommand: >-
      cd frontend && npm ci && npm run build && cd .. &&
      rm -rf marketing/console && cp -r frontend/dist marketing/console &&
      printf 'window.SIGHTLINE_API="%s";\n' "$API_URL" > marketing/assets/js/env.js
    routes:
      # Render serves /admin-portal (no slash) as the directory index without
      # redirecting, which used to break the page's relative asset URLs.
      # Assets are root-absolute now; this keeps the URL canonical anyway.
      - type: redirect
        source: /admin-portal
        destination: /admin-portal/
      - type: rewrite
        source: /login
        destination: /console/index.html
      - type: rewrite
        source: /console
        destination: /console/index.html
      - type: rewrite
        source: /console/*
        destination: /console/index.html
    envVars:
      - key: API_URL
        value: https://sightline-api-i12u.onrender.com
      - key: VITE_API_URL
        value: https://sightline-api-i12u.onrender.com
