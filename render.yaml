# Render Blueprint for the full Sightline stack.
#
# Services:
#   sightline-api       FastAPI backend (portal + console API, WebSocket stream)
#   sightline-console   Operator console (Vite/React SPA)
#   sightline-marketing Marketing site + admin portal (static, no build)
#   sightline-redis     Key Value (sessions, rate limits)
#   sightline-db        Postgres (portal data, occupancy events)
#
# Two-pass URL wiring (Render appends a random suffix to *.onrender.com URLs,
# so they aren't knowable before the first apply):
#   1. Apply the blueprint. Static sites build with localhost fallbacks.
#   2. In the dashboard, set:
#        sightline-console   VITE_API_URL  = https://<sightline-api URL>
#        sightline-marketing API_URL       = https://<sightline-api URL>
#        sightline-marketing CONSOLE_URL   = https://<sightline-console URL>
#      Saving env vars auto-triggers rebuilds.
#
# Admin credentials: ADMIN_PASSWORD is generated by Render on first apply —
# read/change it under sightline-api > Environment.

databases:
  - name: sightline-db
    plan: free
    databaseName: sightline
    user: sightline

services:
  - type: keyvalue
    name: sightline-redis
    plan: free
    ipAllowList: [] # private network only

  - type: web
    name: sightline-api
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r backend/requirements-deploy.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: sightline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sightline-redis
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@sightline.test
      - key: ADMIN_PASSWORD
        generateValue: true
      # Exact-match origins (local dev); onrender.com origins are covered by
      # the regex below, so the two-pass URL wiring never touches the API.
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:8090
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.onrender\.com

  - type: web
    name: sightline-console
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Pass 2: set to the sightline-api public URL (https://...onrender.com)
      - key: VITE_API_URL
        value: ""

  - type: web
    name: sightline-marketing
    runtime: static
    rootDir: marketing
    staticPublishPath: .
    buildCommand: >-
      if [ -n "$API_URL" ]; then
      printf 'window.SIGHTLINE_API="%s";\nwindow.SIGHTLINE_CONSOLE="%s";\n'
      "$API_URL" "$CONSOLE_URL" > assets/js/env.js; fi
    envVars:
      # Pass 2: set to the sightline-api / sightline-console public URLs
      - key: API_URL
        value: ""
      - key: CONSOLE_URL
        value: ""
